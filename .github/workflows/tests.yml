# The site's tests on each push to dev (docs/hosting.md, "Deploy, check and roll back"): the type check, the unit tests,
# and the browser tests in Chromium on Linux (tests/): the layout sweep, and the practice games' consent across tabs.
# Beside them, the layout sweep in Chromium on Windows. On a production build with the practice games' storage on, so
# that the consent banner shows on every page, and the practice games' test runs. Both jobs also serve Drawing Board's
# build (DB_BASE_URL), for the layout test of the monospaced font on that site. A release takes only a commit whose
# run passed. The deploy (deploy.yml) runs the check and the unit tests again before each upload. The sweep in Edge
# stays an option before a release. A newer push cancels a run still going for an older one. The repository is public,
# so the standard runners cost no minutes.
name: Tests

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The site's folder (design 26). npm ci runs at the root, with the workspace's one lockfile. The actions' paths (the
# caches, the failures' screenshots) start at the root.
defaults:
  run:
    working-directory: apps/hedgeschool

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .

      # The engine's release files (engine.lock.json), kept between runs in the download cache that `npm run engine`
      # reads by SHA-256 (packages/engine/src/fetch-engine.mjs). Not static/engine: the script empties that folder on
      # each run. After npm ci, which removes node_modules. The script checks each file's SHA-256, cached or downloaded.
      - name: Cache the engine's files
        uses: actions/cache@v6
        with:
          path: apps/hedgeschool/node_modules/.cache/engine
          key: engine-${{ hashFiles('apps/hedgeschool/engine.lock.json') }}

      # The checks before the browser tests, in the one command that people run too. Its list of steps, each with its
      # flags and environment, is in scripts/check-all.mjs.
      - run: npm run check:all
        working-directory: .

      - name: Cache Playwright's browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
      # Drawing Board's preview (port 4174) beside the site's, for the layout test of the monospaced font on Drawing
      # Board (tests/layout.spec.ts), which runs only when DB_BASE_URL gives the preview's address. Its build is the one
      # that check:all made in this run (the step drawingboard-build), so a stale build cannot pass.
      - name: The browser tests, in Chromium
        env:
          DB_BASE_URL: http://127.0.0.1:4174
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          npm run preview --workspace=drawingboard -- --host 127.0.0.1 --port 4174 --strictPort &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4174/ > /dev/null && break; sleep 1; done
          npx playwright test --project=chromium

      # The failures' screenshots and the page's state, for a week.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: layout-sweep
          path: apps/hedgeschool/test-results/
          retention-days: 7

  # The layout sweep on Windows, for what Windows changes: the fonts (system-ui is Segoe UI there), their rendering, and
  # the scroll bars. In Playwright's own Chromium, as on Linux, not in the runner's Edge, whose version changes with the
  # runner's image.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .

      - name: Cache the engine's files
        uses: actions/cache@v6
        with:
          path: apps/hedgeschool/node_modules/.cache/engine
          key: engine-windows-${{ hashFiles('apps/hedgeschool/engine.lock.json') }}
      - run: npm run engine -- --deploy

      - run: npm run build
        env:
          VITE_EDITION: early
          VITE_STORE_PRACTICE_GAMES: "on"

      # Drawing Board's build, for its layout test below: check:all, which makes it on Linux, does not run on this job.
      - run: npm run build
        working-directory: apps/drawingboard

      # Playwright keeps its browsers in the user's AppData on Windows.
      - name: Cache Playwright's browsers
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-windows-${{ hashFiles('package-lock.json') }}
      # The headless shell only: the project chromium runs headless, with no channel.
      - run: npx playwright install --only-shell chromium
      # Bash, not the default PowerShell, for the commands of the Linux job: the previews in the background, the waits.
      # Drawing Board's preview and DB_BASE_URL, as on Linux, so that the layout test of the monospaced font runs on
      # Drawing Board too, with Windows' fonts and rendering.
      - name: The layout sweep, in Chromium on Windows
        shell: bash
        env:
          DB_BASE_URL: http://127.0.0.1:4174
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          npm run preview --workspace=drawingboard -- --host 127.0.0.1 --port 4174 --strictPort &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4174/ > /dev/null && break; sleep 1; done
          npx playwright test tests/layout.spec.ts --project=chromium

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: layout-sweep-windows
          path: apps/hedgeschool/test-results/
          retention-days: 7
