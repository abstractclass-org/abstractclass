# The site's tests on each push to dev (docs/hosting.md, "Deploy, check and roll back"): the type check, the unit tests,
# and the browser tests in Chromium on Linux (the spec files in tests/, such as the layout sweep and the practice games'
# consent across tabs), in two parts. Beside them, the layout sweep in Chromium on Windows. On a production build with
# the practice games' storage on, so that the consent banner shows on every page, and the practice games' test runs.
# Each job also serves Cyanotype's build (CYANOTYPE_BASE_URL), with its engine's release files, for the tests that open
# a Cyanotype page. A run with no CYANOTYPE_BASE_URL stops (apps/hedgeschool/playwright.config.ts). A release takes only
# a commit whose run passed, so each commit has a concurrency group of its own: a push cancels no run of an older
# commit, and waits for none. The deploy (deploy.yml) runs the check and the unit tests again before each upload, in a
# group of its own, so deploys stay in order. The sweep in Edge stays an option before a release. The repository is
# public, so the standard runners cost no minutes. Runs for older commits still use runner time and count toward the
# limit of concurrent jobs (three jobs for each run).
name: Tests

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

# The site's folder (design 26). npm ci runs at the root, with the workspace's one lockfile. The actions' paths (the
# caches, the failures' screenshots) start at the root.
defaults:
  run:
    working-directory: apps/hedgeschool

jobs:
  # The browser tests on Linux run in two parts at the same time, each on its own runner with its own previews: the
  # layout sweep (tests/layout.spec.ts) in one, every other spec file in the other. The sweep takes about half of the
  # browser tests' time (19 to 21 of 41 to 47 minutes). Playwright's --shard does not fit: it divides by the count of
  # tests and keeps each file whole, so on each file's times it gives parts of about 12 and 28 minutes. Each part runs
  # check:all (about 2 minutes) and builds its own site, as the one job did.
  #
  # One regular expression divides the cases: the part "layout" runs the cases that it matches (--grep), and "other"
  # the rest (--grep-invert), so each case runs in one part. Playwright tests it against the case's project, file name
  # (from tests/), describe titles and title, joined by spaces. With its spaces it matches the file layout.spec.ts and
  # not a file such as review-layout.spec.ts, so a new spec file goes into the part "other". A file filter in one part
  # and --grep-invert in the other could lose a case that neither selects.
  #
  # The time limit. As one job, the Linux job took 37.8 to 47.6 minutes, then 50.2 on a slow runner, and GitHub
  # stopped it at its limit of 50 (abscls-hrrc). In two parts it took 25.3 and 28.7 minutes ("other": 22.6 and 25.7
  # minutes of browser tests), and 25.3 and 23.3 ("layout": 18.7 and 20.8). The part "other" holds Cyanotype's engine
  # tests: its practice games (4 to 5 minutes) and its review with the engine (cyanotype-live-review.spec.ts), the
  # test game's first three turns, about 2 to 3 minutes. That test stops after 12 minutes. The other review tests load
  # a stored review. A slow runner adds about a quarter to the browser tests (the one job's times above), and a slow
  # Playwright install up to 9 minutes. So the part "other" takes up to about 44 minutes on a slow runner with a slow
  # install, and "layout" up to about 39. If the live review then stops at its limit, "other" takes up to about 53. A
  # job that reaches its time limit ends as cancelled, without the failures' screenshots, so the limit of 60 keeps that
  # case a failed test with its report. The Windows job took 22.7 and 22.9 minutes in the same runs. Each limit leaves
  # a margin.
  test:
    name: test (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: layout
            grep: --grep
          - part: other
            grep: --grep-invert
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .

      # The engine's release files (engine.lock.json), kept between runs in the download cache that `npm run engine`
      # reads by SHA-256 (packages/engine/src/fetch-engine.mjs). Not static/engine: the script empties that folder on
      # each run. After npm ci, which removes node_modules. The script checks each file's SHA-256, cached or downloaded.
      # The cache also keeps the manifest of each release of the lock (releases/<tag>/manifest.json), which the step's
      # check of the lock reads (packages/engine/src/release-manifests.ts). When the key finds a cache, actions/cache
      # does not save it again. So the keys' "v2" names the caches that hold the manifests: the caches saved before had
      # none.
      - name: Cache the engine's files
        uses: actions/cache@v6
        with:
          path: apps/hedgeschool/node_modules/.cache/engine
          key: engine-v2-${{ hashFiles('apps/hedgeschool/engine.lock.json') }}
      # Cyanotype's engine files (apps/cyanotype/engine.lock.json), in Cyanotype's own download cache, for its step
      # cyanotype-engine in check:all.
      - name: Cache Cyanotype's engine files
        uses: actions/cache@v6
        with:
          path: apps/cyanotype/node_modules/.cache/engine
          key: cyanotype-engine-v2-${{ hashFiles('apps/cyanotype/engine.lock.json') }}

      # The checks before the browser tests, in the one command that people run too. Its list of steps, each with its
      # flags and environment, is in scripts/check-all.mjs.
      - run: npm run check:all
        working-directory: .

      - name: Cache Playwright's browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
      # Cyanotype's preview (port 4174) beside the site's, for the tests that open a Cyanotype page, which run only when
      # CYANOTYPE_BASE_URL gives the preview's address. Its build is the one that check:all made in this run (the step
      # cyanotype-build), with the engine's files of the step cyanotype-engine, so a stale build cannot pass.
      - name: The browser tests, in Chromium
        env:
          CYANOTYPE_BASE_URL: http://127.0.0.1:4174
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          npm run preview --workspace=cyanotype -- --host 127.0.0.1 --port 4174 --strictPort &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4174/ > /dev/null && break; sleep 1; done
          npx playwright test --project=chromium ${{ matrix.grep }} ' layout\.spec\.ts '

      # The failures' screenshots and the page's state, for a week.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-tests-${{ matrix.part }}
          path: apps/hedgeschool/test-results/
          retention-days: 7

  # The layout sweep on Windows, for what Windows changes: the fonts (system-ui is Segoe UI there), their rendering, and
  # the scroll bars. In Playwright's own Chromium, as on Linux, not in the runner's Edge, whose version changes with the
  # runner's image.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .

      - name: Cache the engine's files
        uses: actions/cache@v6
        with:
          path: apps/hedgeschool/node_modules/.cache/engine
          key: engine-v2-windows-${{ hashFiles('apps/hedgeschool/engine.lock.json') }}
      - run: npm run engine -- --deploy

      - run: npm run build
        env:
          VITE_EDITION: early
          VITE_STORE_PRACTICE_GAMES: "on"

      # Cyanotype's build with its engine's release files, in the early edition, for the layout test below: check:all,
      # which makes it on Linux, does not run on this job.
      - name: Cache Cyanotype's engine files
        uses: actions/cache@v6
        with:
          path: apps/cyanotype/node_modules/.cache/engine
          key: cyanotype-engine-v2-windows-${{ hashFiles('apps/cyanotype/engine.lock.json') }}
      - run: npm run engine -- --deploy
        working-directory: apps/cyanotype
      - run: npm run build
        working-directory: apps/cyanotype
        env:
          VITE_EDITION: early
          VITE_STORE_PRACTICE_GAMES: "on"

      # Playwright keeps its browsers in the user's AppData on Windows.
      - name: Cache Playwright's browsers
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-windows-${{ hashFiles('package-lock.json') }}
      # The headless shell only: the project chromium runs headless, with no channel.
      - run: npx playwright install --only-shell chromium
      # Bash, not the default PowerShell, for the commands of the Linux job: the previews in the background, the waits.
      # Cyanotype's preview and CYANOTYPE_BASE_URL, as on Linux, so that the layout sweep runs on Cyanotype's pages too,
      # with Windows' fonts and rendering.
      - name: The layout sweep, in Chromium on Windows
        shell: bash
        env:
          CYANOTYPE_BASE_URL: http://127.0.0.1:4174
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          npm run preview --workspace=cyanotype -- --host 127.0.0.1 --port 4174 --strictPort &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4174/ > /dev/null && break; sleep 1; done
          npx playwright test tests/layout.spec.ts --project=chromium

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: layout-sweep-windows
          path: apps/hedgeschool/test-results/
          retention-days: 7
