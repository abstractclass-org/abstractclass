# The site's deploy (docs/hosting.md, section 3): each push builds the site and uploads it to the Cloudflare Pages
# project hedgeschool with Wrangler. A push to main deploys the live site. A push to another branch deploys a preview,
# at <branch>.hedgeschool.pages.dev. The project has no Git connection: Cloudflare cannot connect a Git repository to an
# existing Pages project. The project's own settings stay in Cloudflare: the D1 binding GAMES, the compatibility date
# and the domain. So the repository has no Wrangler file: with one, Pages would take the bindings from that file.
# The build is the one that Cloudflare's own build ran (npm run build:cloudflare): the engine's release with its SHA-256
# checks, the unit tests, the type check, then the build. A failed step deploys nothing, and the site stays as it was.
# The job hub deploys the hub at abstractclass.org (apps/hub) to its own Pages project, beside the site's job. The job
# cyanotype deploys Cyanotype (apps/cyanotype) to its own Pages project too.
#
# The live deploys wait for the owner (docs/hosting.md, "Deploy, check and roll back"). On main, each job runs in its
# own GitHub Environment: hedgeschool, hub and cyanotype. Each environment has the owner as its required reviewer, so
# GitHub holds each job of a push to main until the owner approves it in the run, and a job not approved deploys
# nothing. A push to another branch names no environment, so its previews deploy with no approval. Each job's
# `environment:` is an expression that gives the name on main and an empty string elsewhere. GitHub's documents allow
# an expression there ("The value of `name` can be an expression", with the contexts github, inputs, vars, needs,
# strategy and matrix:
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idenvironment). They do
# not say what an empty name does. The workflow parser in GitHub's runner gives no environment for an empty name
# (ConvertToActionEnvironmentReference: `String.IsNullOrEmpty(nameString.Value) ? null : ...`,
# https://github.com/actions/runner/blob/cab9d1c3901e45c7705889c4f88284fdd93f4ae5/src/Sdk/WorkflowParser/Conversion/WorkflowTemplateConverter.cs#L705),
# so the job runs as it did before, with no environment.
#
# The owner creates the three environments, each with a required reviewer, before the first push to main that has
# this change (docs/hosting.md, "The live deploys wait for approval"). A workflow that names a missing environment
# makes it, with no protection rules
# (https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/manage-environments#creating-an-environment),
# and GitHub then runs the job with no approval. So on main each job checks its environment first, and fails before
# its upload when the environment has no required reviewer.
name: Deploy

on:
  push:
  workflow_dispatch:

# One deploy at a time for each branch, in the order of the pushes.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# The site's folder (design 26). npm ci runs at the root, with the workspace's one lockfile.
defaults:
  run:
    working-directory: apps/hedgeschool

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'hedgeschool' || '' }}
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # On main: stop before the upload when the environment has no required reviewer (the comment at the top). The
      # job's token reads the environment with its permission contents: read, because the repository is public: "This
      # endpoint can be used without authentication or the aforementioned permissions if only public resources are
      # requested" (https://docs.github.com/en/rest/deployments/environments#get-an-environment). A reader who is not an
      # administrator sees the reviewers of a public repository's environment in the answer. When the API does not give
      # the environment, the step fails too, and nothing deploys: run the job again. If it answers 403, the token needs
      # the permission that the page names for other cases, `actions: read`.
      - name: The live deploy has a required reviewer
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: hedgeschool
        run: |
          query='[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length'
          n=$(gh api "repos/$GITHUB_REPOSITORY/environments/$ENVIRONMENT" --jq "$query") || n=
          if [ -z "$n" ]; then echo "::error::GitHub's API did not give the environment $ENVIRONMENT."; exit 1; fi
          if [ "$n" -lt 1 ]; then echo "::error::The environment $ENVIRONMENT has no required reviewer."; exit 1; fi
          echo "The environment $ENVIRONMENT has $n required reviewer(s)."

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .

      # The two variables of Cloudflare's own build that vite.config.ts reads: the branch (main names the live site's
      # address, partner_test turns on the partners' test) and the preview's address, for the userscript. Pages names a
      # branch's preview by the branch, lowercased, with a hyphen for each character that is not a letter or a digit.
      - name: The branch and its address
        run: |
          alias=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g')
          echo "CF_PAGES_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "CF_PAGES_URL=https://$alias.hedgeschool.pages.dev" >> "$GITHUB_ENV"

      # The shared packages' type checks and unit tests (design 29), before the site's own in build:cloudflare.
      - name: The packages' checks and tests
        run: npm run check --workspace=packages && npm test --workspace=packages
        working-directory: .

      # The build's variables (repository variables). Previews have no Google Analytics and no Web Analytics, so that
      # their visits are not counted.
      - run: npm run build:cloudflare
        env:
          VITE_EDITION: ${{ vars.VITE_EDITION }}
          VITE_STORE_PRACTICE_GAMES: ${{ vars.VITE_STORE_PRACTICE_GAMES }}
          VITE_GA_ID: ${{ github.ref_name == 'main' && vars.VITE_GA_ID || '' }}
          VITE_CF_ANALYTICS_TOKEN: ${{ github.ref_name == 'main' && vars.VITE_CF_ANALYTICS_TOKEN || '' }}

      # Wrangler, pinned. It uploads build/ and the Pages Function in functions/. It takes functions/ from the folder
      # that it runs in, which is the site's folder. From another folder, the deployment has no Function. The branch
      # decides production or preview: the project's production branch is main. The deployment's message is the
      # commit's first line, cut to 300 characters (the runner's locale is UTF-8, so the cut keeps whole characters).
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          args=(--project-name=hedgeschool --branch="$BRANCH" --commit-hash="$GITHUB_SHA")
          first=${MESSAGE%%$'\n'*}
          if [ -n "$first" ]; then args+=(--commit-message="${first:0:300}"); fi
          npx --yes wrangler@4.144.0 pages deploy build "${args[@]}"

  # The hub at abstractclass.org (design 26, item 3; docs/hosting.md, "The hub"): its files in apps/hub/public, as they
  # are, with no build, to the Pages project abstractclass. A push to main deploys the live hub when the owner approves
  # it, and a push to another branch a preview, as for the site. Wrangler is the site job's version. It runs in
  # apps/hub, which has no functions/ folder: in the workflow's default folder, it would upload Hedge School's Function
  # with the hub.
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref_name == 'main' && 'hub' || '' }}
    defaults:
      run:
        working-directory: apps/hub
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # On main: stop when the environment has no required reviewer, as in the job deploy.
      - name: The live deploy has a required reviewer
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: hub
        run: |
          query='[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length'
          n=$(gh api "repos/$GITHUB_REPOSITORY/environments/$ENVIRONMENT" --jq "$query") || n=
          if [ -z "$n" ]; then echo "::error::GitHub's API did not give the environment $ENVIRONMENT."; exit 1; fi
          if [ "$n" -lt 1 ]; then echo "::error::The environment $ENVIRONMENT has no required reviewer."; exit 1; fi
          echo "The environment $ENVIRONMENT has $n required reviewer(s)."

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          args=(--project-name=abstractclass --branch="$BRANCH" --commit-hash="$GITHUB_SHA")
          first=${MESSAGE%%$'\n'*}
          if [ -n "$first" ]; then args+=(--commit-message="${first:0:300}"); fi
          npx --yes wrangler@4.144.0 pages deploy public "${args[@]}"

  # Cyanotype, Blueprints' site (design 33; docs/hosting.md, "Cyanotype"): apps/cyanotype, built and checked as the
  # site's build is, with its engine's release files, to the Pages project cyanotype. A push to main deploys the live
  # site when the owner approves it, and a push to another branch a preview, as for the site. The job has no switch:
  # the project exists, and the build has its engine, so each push deploys. Only the owner's approval of the
  # environment cyanotype keeps a release of main from deploying Cyanotype live. Its pages are prerendered, and the
  # canonical address is the live one in src/lib/site.ts. Its userscript holds the build's own address, as the site's
  # does, so its build takes the branch variables too. Wrangler is the site job's version. It runs in apps/cyanotype,
  # which has no functions/ folder: in the workflow's default folder, it would upload Hedge School's Function.
  cyanotype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'cyanotype' || '' }}
    defaults:
      run:
        working-directory: apps/cyanotype
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # On main: stop when the environment has no required reviewer, as in the job deploy.
      - name: The live deploy has a required reviewer
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: cyanotype
        run: |
          query='[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length'
          n=$(gh api "repos/$GITHUB_REPOSITORY/environments/$ENVIRONMENT" --jq "$query") || n=
          if [ -z "$n" ]; then echo "::error::GitHub's API did not give the environment $ENVIRONMENT."; exit 1; fi
          if [ "$n" -lt 1 ]; then echo "::error::The environment $ENVIRONMENT has no required reviewer."; exit 1; fi
          echo "The environment $ENVIRONMENT has $n required reviewer(s)."

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        working-directory: .

      # The two variables of Cloudflare's own build that vite.config.ts reads, as in the site's job: the branch (main
      # names the live site's address) and the preview's address, for the userscript. A preview is at <branch>.<host>,
      # where the host is the project's pages.dev address. That host is not always <project>.pages.dev: Pages adds
      # characters when that address is taken (the project cyanotype is at cyanotype-ztp.pages.dev). So the step reads
      # the host from the project in Cloudflare's API (its `subdomain`), with the deploy's token and account. The build
      # needs the address, so Wrangler's deploy output, which comes after the build, cannot give it. When the API gives
      # no pages.dev address, the job fails here and deploys nothing. `|| true` keeps a failed curl or jq from ending
      # the step before its message: curl -sS writes its own error above it.
      - name: The branch and its address
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/cyanotype"
          host=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url" | jq -r '.result.subdomain') || true
          if [[ "$host" != *.pages.dev ]]; then
            echo "::error::Cloudflare's API gave no pages.dev address for the Pages project cyanotype."
            exit 1
          fi
          alias=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g')
          echo "CF_PAGES_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "CF_PAGES_URL=https://$alias.$host" >> "$GITHUB_ENV"

      # The shared packages' checks and tests (design 29), then the site's own: a failed step deploys nothing. The
      # engine's files come first, from the release that engine.lock.json pins, each with its SHA-256 checked. --deploy
      # refuses a file from this machine. The engine's tests need the files, and the build copies them.
      - name: The packages' checks and tests
        run: npm run check --workspace=packages && npm test --workspace=packages
        working-directory: .
      - run: npm run engine -- --deploy && npm run check && npm test && npm run build

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          args=(--project-name=cyanotype --branch="$BRANCH" --commit-hash="$GITHUB_SHA")
          first=${MESSAGE%%$'\n'*}
          if [ -n "$first" ]; then args+=(--commit-message="${first:0:300}"); fi
          npx --yes wrangler@4.144.0 pages deploy build "${args[@]}"
