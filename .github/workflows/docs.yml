# The documents wrap at 120 characters (docs/working-notes.md): on each push to dev, an added line over 120 in a
# Markdown file of the pushed range fails the run. What counts is in scripts/doc-widths.mjs. Its own workflow, with no
# cancel, so that the range of every push is checked: a run of Tests is about the commit, this one is about the range.
# Beside it, the tests of the check and of the commit-msg and pre-push hooks (.githooks/).
name: Documents

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  widths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The whole history and every branch, so that the commit before the push and main are there.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: The tests of the width check and of the commit-msg and pre-push hooks
        run: node --test "scripts/*.test.mjs" && sh scripts/commit-msg.test.sh && sh scripts/pre-push.test.sh

      # The pushed range: the pushed commits, from where they leave the branch's commit before the push (the merge
      # base: that commit itself, unless the push was forced). After a force push, the commit before is on no branch,
      # so the clone does not have it: it is fetched by its hash. A new branch (its commit before is all zeros), a run
      # by hand (no commit before), or a commit that GitHub no longer has: the range then starts where dev leaves main,
      # which holds every commit of the push.
      - name: The documents' widths in the pushed range
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$BEFORE" in *[!0]*) ;; *) BEFORE= ;; esac
          if [ -n "$BEFORE" ] && ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git fetch --quiet --no-tags origin "$BEFORE" || true
          fi
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            FROM=$(git merge-base "$BEFORE" HEAD)
          else
            FROM=$(git merge-base origin/main HEAD)
            echo "No commit before the push: the range starts where dev leaves main, at $FROM."
          fi
          node scripts/doc-widths.mjs "$FROM" HEAD
